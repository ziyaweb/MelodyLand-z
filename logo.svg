<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">MusicVerse Adventure</title>
  <desc id="desc">A dreamy blue music note with orbiting stars and the MusicVerse Adventure wordmark.</desc>
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset=".52" stop-color="#d9eaff"/>
      <stop offset="1" stop-color="#a9caff"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76c9f4"/>
      <stop offset=".55" stop-color="#638de8"/>
      <stop offset="1" stop-color="#a58ce9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#315d9c" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="108" r="83" fill="url(#orb)" stroke="#fff" stroke-width="5"/>
    <ellipse cx="110" cy="108" rx="97" ry="35" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3" transform="rotate(-28 110 108)"/>
    <path d="M119 53v83a20 20 0 1 1-12-18V73l57-13v64a20 20 0 1 1-12-18V47z" fill="url(#note)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M45 62l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#ffd779"/>
    <path d="M177 39l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffacd3"/>
    <circle cx="180" cy="154" r="5" fill="#83d9ca"/>
  </g>
  <text x="222" y="106" font-family="Nunito, Arial, sans-serif" font-size="61" font-weight="900" letter-spacing="-1.5" fill="url(#word)" stroke="#4f7fc5" stroke-width="1.2" paint-order="stroke">MusicVerse</text>
  <text x="228" y="151" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="7" fill="#fff">ADVENTURE WORLD</text>
  <path d="M228 171h335" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="577" cy="171" r="4" fill="#ffd779"/>
  <path d="M615 49l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd779"/>
  <circle cx="672" cy="130" r="5" fill="#ffacd3"/>
  <circle cx="642" cy="155" r="3" fill="#9ce5dc"/>
